# Сборка FOLIO в Codemagic и отправка в TestFlight.
# Подготовка (один раз) описана в CODEMAGIC.md.
definitions:
  scripts:
    - &unit_tests
      name: Unit-тесты
      script: |
        set -euo pipefail
        if [ "${SKIP_TESTS:-}" = "1" ]; then echo "Тесты пропущены (SKIP_TESTS=1)"; exit 0; fi
        DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c '
        import json, sys
        data = json.load(sys.stdin)["devices"]
        ios = sorted((k for k in data if "iOS" in k), key=lambda k: [int(x) for x in k.split("iOS-")[-1].split("-")])
        for runtime in reversed(ios):
            for d in data[runtime]:
                if d["name"].startswith("iPhone") and d.get("isAvailable", True):
                    print(d["udid"]); sys.exit()
        ')
        echo "Симулятор: $DEVICE_ID"
        mkdir -p build/ios/test
        xcodebuild test \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -destination "id=$DEVICE_ID" \
          -resultBundlePath build/ios/test/FOLIOTests.xcresult \
          CODE_SIGNING_ALLOWED=NO | xcpretty --report junit --output build/ios/test/results.xml
      test_report: build/ios/test/results.xml

workflows:
  # Проверка без подписи и ключей Apple: компиляция всех targets и unit-тесты. Запускается на любой ветке.
  ios-ci:
    name: FOLIO — сборка и тесты
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      xcode: latest
      vars:
        XCODE_PROJECT: FOLIO.xcodeproj
        XCODE_SCHEME: FOLIO
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: "*"
          include: true
      cancel_previous_builds: true
    scripts:
      - name: Проверка структуры проекта
        script: python3 scripts/release_check.py
      - name: Сборка для устройства без подписи
        script: |
          set -euo pipefail
          xcodebuild build \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - *unit_tests
    artifacts:
      - build/ios/test/*.xcresult
      - /tmp/xcodebuild_logs/*.log

  ios-testflight:
    name: FOLIO → TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    # Ключ App Store Connect API — из интеграции команды (переменные APP_STORE_CONNECT_*).
    integrations:
      app_store_connect: monetniy-mir-asc
    environment:
      xcode: latest
      # Подпись — облачная, средствами Xcode (-allowProvisioningUpdates + ключ App Store Connect):
      # Apple выдаёт управляемый сертификат Distribution и профили сам. Закрытый ключ сертификата не нужен,
      # лимит Distribution-сертификатов команды не мешает.
      vars:
        XCODE_PROJECT: FOLIO.xcodeproj
        XCODE_SCHEME: FOLIO
    # Запускается вручную (Start new build) или через API.
    scripts:
      - name: Проверка структуры проекта
        script: python3 scripts/release_check.py

      - name: TestFlight — приложение и внутренние тестировщики
        script: |
          set -euo pipefail
          BUNDLE_ID=$(grep -m1 -oE 'FOLIO_APP_BUNDLE_ID = [^;]+' "$XCODE_PROJECT/project.pbxproj" | awk '{print $3}')
          python3 -m venv /tmp/ascenv
          /tmp/ascenv/bin/pip install --quiet --disable-pip-version-check pyjwt cryptography
          /tmp/ascenv/bin/python scripts/asc_testflight.py "$BUNDLE_ID"

      - name: Bundle ID и номер сборки
        script: |
          set -euo pipefail
          PBX="$XCODE_PROJECT/project.pbxproj"
          BUNDLE_ID="${BUNDLE_ID:-$(grep -m1 -oE 'FOLIO_APP_BUNDLE_ID = [^;]+' "$PBX" | awk '{print $3}')}"
          echo "Bundle ID: $BUNDLE_ID"
          echo "BUNDLE_ID=$BUNDLE_ID" >> "$CM_ENV"
          # Подставляем конкретные идентификаторы, чтобы xcode-project use-profiles однозначно сопоставил профили.
          perl -pi -e "s/FOLIO_APP_BUNDLE_ID = [^;]+;/FOLIO_APP_BUNDLE_ID = $BUNDLE_ID;/g" "$PBX"
          perl -pi -e "s/\"\\\$\(FOLIO_APP_BUNDLE_ID\)\.share\"/$BUNDLE_ID.share/g; s/\"\\\$\(FOLIO_APP_BUNDLE_ID\)\.tests\"/$BUNDLE_ID.tests/g; s/\"\\\$\(FOLIO_APP_BUNDLE_ID\)\"/$BUNDLE_ID/g" "$PBX"
          grep -n "PRODUCT_BUNDLE_IDENTIFIER" "$PBX"

          LATEST=0
          if [ -n "${APP_STORE_APPLE_ID:-}" ]; then
            LATEST=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null || echo 0)
          fi
          if [ "$LATEST" -gt 0 ] 2>/dev/null; then
            NEW_BUILD=$((LATEST + 1))
          else
            NEW_BUILD=$((BUILD_NUMBER + 6))
          fi
          echo "Номер сборки: $NEW_BUILD"
          perl -pi -e "s/CURRENT_PROJECT_VERSION = [0-9]+;/CURRENT_PROJECT_VERSION = $NEW_BUILD;/g" "$PBX"


      - *unit_tests

      - name: Архив и IPA (облачная подпись Xcode)
        script: |
          set -euo pipefail
          test -n "${FOLIO_TEAM_ID:-}" || { echo "Нет FOLIO_TEAM_ID — см. шаг TestFlight"; exit 1; }
          AUTH=(-allowProvisioningUpdates
                -authenticationKeyPath "$ASC_KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID"
                -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          mkdir -p build/ios/ipa
          # Архив подписывается локально (ad-hoc, с entitlements, включая App Group) — сертификат разработчика
          # не нужен. Подпись App Store ставится при экспорте облачной подписью Apple.
          xcodebuild archive \
            -project "$XCODE_PROJECT" \
            -scheme "$XCODE_SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/ios/FOLIO.xcarchive \
            DEVELOPMENT_TEAM="$FOLIO_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="-" \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=NO \
            PROVISIONING_PROFILE_SPECIFIER="" > build/ios/archive.log 2>&1 \
            || { grep -E "error:|warning: .*(sign|profile|certificate)|Provisioning|Signing|No profiles|No Account" build/ios/archive.log | sort -u | head -40; tail -30 build/ios/archive.log; exit 1; }
          echo "Архив создан"
          for app in build/ios/FOLIO.xcarchive/Products/Applications/*.app build/ios/FOLIO.xcarchive/Products/Applications/*.app/PlugIns/*.appex; do
            echo "== $app"; codesign -d --entitlements - "$app" 2>/dev/null | grep -A3 application-groups || echo "   (нет App Group в подписи)"
          done
          cat > build/ios/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$FOLIO_TEAM_ID</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath build/ios/FOLIO.xcarchive \
            -exportOptionsPlist build/ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            "${AUTH[@]}" > build/ios/export.log 2>&1 \
            || { grep -E "error|Error|profile|certificate" build/ios/export.log | sort -u | head -40; tail -30 build/ios/export.log; exit 1; }
          ls -la build/ios/ipa

    artifacts:
      - build/ios/ipa/*.ipa
      - build/ios/test/*.xcresult
      - /tmp/xcodebuild_logs/*.log
      - build/ios/FOLIO.xcarchive/dSYMs/*.dSYM
      - build/ios/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
